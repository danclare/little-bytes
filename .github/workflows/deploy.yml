name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Optional explicit release version (X.Y.Z). Leave empty to derive from conventional commits."
        required: false
        default: ""
      rollback_image_sha:
        description: "Optional 40-character commit SHA of a retained image to roll back to. Skips build and migration."
        required: false
        default: ""

permissions:
  contents: write # pushes the vX.Y.Z release tag after a successful deployment
  id-token: write # GitHub OIDC federation to Microsoft Entra; no client secret is stored

concurrency:
  group: little-bites-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Provision, build, migrate and deploy
    runs-on: [self-hosted, linux, little-bites-private]
    environment: production
    env:
      TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION }}
      TF_VAR_name_prefix: ${{ vars.NAME_PREFIX }}
      TF_VAR_environment: production
      TF_VAR_unique_suffix: ${{ vars.UNIQUE_SUFFIX }}
      TF_VAR_app_url: ${{ vars.APP_URL || 'https://localhost' }}
      TF_VAR_postgres_admin_username: ${{ vars.POSTGRES_ADMIN_USERNAME }}
      TF_VAR_postgres_sku_name: ${{ vars.POSTGRES_SKU_NAME }}
      TF_VAR_deployment_principal_object_id: ${{ vars.DEPLOYMENT_PRINCIPAL_OBJECT_ID }}
      TF_VAR_entra_sign_in_enabled: ${{ vars.ENTRA_SIGN_IN_ENABLED || 'true' }}
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_ROLLBACK_SHA: ${{ inputs.rollback_image_sha }}
      RETAINED_IMAGES: "2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # release tags and commit history are needed for semantic versioning
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.14.8
          terraform_wrapper: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Resolve release mode, version and image SHA
        run: |
          set -euo pipefail
          if [ -n "$INPUT_ROLLBACK_SHA" ]; then
            if ! [[ "$INPUT_ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "rollback_image_sha must be a full 40-character lowercase commit SHA." >&2
              exit 1
            fi
            {
              echo "ROLLBACK=true"
              echo "IMAGE_SHA=$INPUT_ROLLBACK_SHA"
            } >> "$GITHUB_ENV"
            echo "Rolling back to image $INPUT_ROLLBACK_SHA"
            exit 0
          fi
          if [ -n "$INPUT_VERSION" ]; then
            if ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "version must be X.Y.Z" >&2
              exit 1
            fi
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(node scripts/release-version.mjs)"
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Release tag v$VERSION already exists." >&2
            exit 1
          fi
          {
            echo "ROLLBACK=false"
            echo "VERSION=$VERSION"
            echo "IMAGE_SHA=$GITHUB_SHA"
          } >> "$GITHUB_ENV"
          echo "Releasing v$VERSION from $GITHUB_SHA"

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize Terraform remote state
        working-directory: infra/terraform
        env:
          TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
          TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=$TF_STATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=little-bites/production.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

      # Terraform owns infrastructure only. On first creation the Container App and migration job use
      # the placeholder bootstrap image; image references are ignored afterwards and set below.
      - name: Apply infrastructure
        if: env.ROLLBACK == 'false'
        working-directory: infra/terraform
        run: |
          terraform plan -input=false -out=production.tfplan
          terraform show -no-color production.tfplan
          terraform apply -input=false production.tfplan

      - name: Apply generated Container App origin when no custom origin is configured
        if: env.ROLLBACK == 'false' && !vars.APP_URL
        working-directory: infra/terraform
        run: |
          APP_URL="$(terraform output -raw application_url)"
          export TF_VAR_app_url="$APP_URL"
          echo "TF_VAR_app_url=$APP_URL" >> "$GITHUB_ENV"
          terraform plan -input=false -out=origin.tfplan
          terraform show -no-color origin.tfplan
          terraform apply -input=false origin.tfplan

      - name: Read deployment targets
        working-directory: infra/terraform
        env:
          CUSTOM_APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          {
            echo "ACR_NAME=$(terraform output -raw container_registry_name)"
            echo "ACR_LOGIN_SERVER=$(terraform output -raw container_registry_login_server)"
            echo "WEB_REPO=$(terraform output -raw web_image_repository)"
            echo "MIGRATOR_REPO=$(terraform output -raw migrator_image_repository)"
            echo "APP_NAME=$(terraform output -raw container_app_name)"
            echo "JOB_NAME=$(terraform output -raw container_app_job_name)"
            echo "DEPLOYED_APP_URL=${CUSTOM_APP_URL:-$(terraform output -raw application_url)}"
          } >> "$GITHUB_ENV"

      - name: Authenticate to Azure Container Registry
        run: |
          for _ in $(seq 1 12); do
            if az acr login --name "$ACR_NAME"; then exit 0; fi
            sleep 10
          done
          echo "Could not authenticate to ACR (role assignments may still be propagating)." >&2
          exit 1

      # Single-platform manifests (no provenance/SBOM attestations) keep one manifest per release, so
      # the retention step can reason about "latest N images" directly.
      - name: Build and push web and migration images
        if: env.ROLLBACK == 'false'
        run: |
          set -euo pipefail
          LABELS=(--label "org.opencontainers.image.version=$VERSION" --label "org.opencontainers.image.revision=$IMAGE_SHA")
          docker buildx build --push --provenance=false --sbom=false --target web "${LABELS[@]}" \
            --tag "$ACR_LOGIN_SERVER/$WEB_REPO:$IMAGE_SHA" \
            --tag "$ACR_LOGIN_SERVER/$WEB_REPO:$VERSION" .
          docker buildx build --push --provenance=false --sbom=false --target migrator "${LABELS[@]}" \
            --tag "$ACR_LOGIN_SERVER/$MIGRATOR_REPO:$IMAGE_SHA" \
            --tag "$ACR_LOGIN_SERVER/$MIGRATOR_REPO:$VERSION" .

      - name: Verify rollback images are still retained
        if: env.ROLLBACK == 'true'
        run: |
          set -euo pipefail
          az acr manifest show-metadata --registry "$ACR_NAME" --name "$WEB_REPO:$IMAGE_SHA" --query digest -o tsv
          az acr manifest show-metadata --registry "$ACR_NAME" --name "$MIGRATOR_REPO:$IMAGE_SHA" --query digest -o tsv

      - name: Set migration job image and run migrations
        if: env.ROLLBACK == 'false'
        run: |
          set -euo pipefail
          az containerapp job update --name "$JOB_NAME" --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/$MIGRATOR_REPO:$IMAGE_SHA" --output none
          EXECUTION="$(az containerapp job start --name "$JOB_NAME" --resource-group "$RESOURCE_GROUP" --query name -o tsv)"
          for _ in $(seq 1 120); do
            STATUS="$(az containerapp job execution show --name "$JOB_NAME" --resource-group "$RESOURCE_GROUP" \
              --job-execution-name "$EXECUTION" --query 'properties.status' -o tsv)"
            echo "Migration execution $EXECUTION status: ${STATUS:-pending}"
            if [ "$STATUS" = "Succeeded" ]; then exit 0; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Stopped" ]; then
              echo "Database migration failed; the web image was not changed." >&2
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for database migration." >&2
          exit 1

      - name: Set web application image
        run: |
          az containerapp update --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/$WEB_REPO:$IMAGE_SHA" --output none

      - name: Verify deployment health, image and scaling
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 18 --retry-delay 10 --retry-all-errors "$DEPLOYED_APP_URL/api/health"
          echo
          SESSION_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' "$DEPLOYED_APP_URL/api/auth/session")"
          test "$SESSION_STATUS" = "401" || { echo "Unauthenticated session check returned $SESSION_STATUS" >&2; exit 1; }
          read -r IMAGE MIN_REPLICAS MAX_REPLICAS REVISION < <(az containerapp show --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query '[properties.template.containers[0].image, properties.template.scale.minReplicas, properties.template.scale.maxReplicas, properties.latestRevisionName]' \
            -o tsv | tr '\n' ' ')
          test "$IMAGE" = "$ACR_LOGIN_SERVER/$WEB_REPO:$IMAGE_SHA"
          test "$MIN_REPLICAS" = "0"
          test "$MAX_REPLICAS" = "3"
          echo "Verified $DEPLOYED_APP_URL image=$IMAGE revision=$REVISION min=$MIN_REPLICAS max=$MAX_REPLICAS"

      # Keeps the newest $RETAINED_IMAGES manifests per repository (current + one rollback target) and
      # never deletes the digest that is currently deployed.
      - name: Prune old container images
        run: |
          set -euo pipefail
          for REPO in "$WEB_REPO" "$MIGRATOR_REPO"; do
            KEEP_DIGEST="$(az acr manifest show-metadata --registry "$ACR_NAME" --name "$REPO:$IMAGE_SHA" --query digest -o tsv)"
            mapfile -t DIGESTS < <(az acr manifest list-metadata --registry "$ACR_NAME" --name "$REPO" \
              --orderby time_desc --query "[${RETAINED_IMAGES}:].digest" -o tsv)
            for DIGEST in "${DIGESTS[@]}"; do
              if [ -z "$DIGEST" ] || [ "$DIGEST" = "$KEEP_DIGEST" ]; then continue; fi
              echo "Deleting $REPO@$DIGEST"
              az acr manifest delete --registry "$ACR_NAME" --name "$REPO@$DIGEST" --yes
            done
            echo "Retained images in $REPO:"
            az acr manifest list-metadata --registry "$ACR_NAME" --name "$REPO" --orderby time_desc \
              --query "[].{digest:digest, tags:tags, created:createdTime}" -o table
          done

      - name: Push release tag
        if: env.ROLLBACK == 'false'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" "$IMAGE_SHA" -m "Little Bites v$VERSION"
          git push origin "v$VERSION"
